<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Subway Optimization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
.leaflet-container{font-family:inherit;background:#D6E4EE}
.leaflet-tile-pane{filter:grayscale(0.85) brightness(1.04)}
.rec-marker{background:none;border:0}
body{margin:0;background:#F4F6F9}
*{box-sizing:border-box}
a{color:#2457D6}a:hover{color:#1A3F9E}
input[type=checkbox]{accent-color:#2457D6;width:18px;height:18px;margin:0}
input[type=range]{accent-color:#2457D6}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/template" id="tpl"><div style="width: 100%; min-height: 100vh; background: #F4F6F9; color: #12161C; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E7ED; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #12161C; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 10 H19"></path><circle cx="9" cy="13.5" r="0.8" fill="#FFFFFF"></circle><circle cx="15" cy="13.5" r="0.8" fill="#FFFFFF"></circle><path d="M8 17 L6 21 M16 17 L18 21"></path></svg>
</span>
<span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">NYC Subway Optimization</span>
<span style="font-size: 12px; font-weight: 600; color: #8A4B00; background: #FFF1DC; border-radius: 999px; padding: 4px 10px">{{badge}}</span>
</div>
<nav aria-label="Sections" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; justify-content: center">
<a href="#explore" aria-current="page" style="padding: 10px 16px; border-radius: 8px; background: #E8EFFD; color: #2457D6; font-weight: 600; text-decoration: none">Explore</a>
<a href="#recommendations" style="padding: 10px 16px; border-radius: 8px; color: #12161C; font-weight: 500; text-decoration: none">Recommendations</a>
<a href="#impact" style="padding: 10px 16px; border-radius: 8px; color: #12161C; font-weight: 500; text-decoration: none">Impact Analysis</a>
<a href="#data" style="padding: 10px 16px; border-radius: 8px; color: #12161C; font-weight: 500; text-decoration: none">Data &amp; Methodology</a>
</nav>
<label style="display: flex; align-items: center; gap: 10px; border: 1px solid #D5DBE3; border-radius: 10px; padding: 0 14px; height: 44px; flex: 0 1 360px; min-width: 220px; background: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16 16"></path></svg>
<input type="search" aria-label="Search neighborhood, station, or address" placeholder="Search neighborhood, station, or address…" style="border: 0; outline: none; flex: 1; min-width: 0; font: inherit; color: #12161C; background: transparent">
</label>
</header>

<main id="explore" style="padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">

<section aria-label="Controls" style="flex: 1 1 290px; max-width: 340px; min-width: 260px; background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Optimization goal</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #D5DBE3; border-radius: 10px; padding: 3px; gap: 3px">
<button type="button" aria-pressed="{{accessPressed}}" data-ev-click="setAccess" style="{{accessStyle}}">Accessibility</button>
<button type="button" aria-pressed="{{effPressed}}" data-ev-click="setEff" style="{{effStyle}}">Efficiency</button>
</div>
<p style="margin: 0; color: #5B6472; line-height: 1.5">{{goalText}}</p>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; border-top: 1px solid #EDF0F4; padding-top: 18px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Candidate stations</h2>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" role="switch" aria-checked="{{showStr}}" aria-label="Show recommended locations" data-ev-click="toggleShow" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
<span>Show recommended locations</span>
</div>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; justify-content: space-between"><span>Number of stations</span><strong>{{n}}</strong></span>
<input type="range" min="1" max="5" step="1" value="{{n}}" data-ev-change="setN" style="width: 100%">
</label>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #EDF0F4; padding-top: 18px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Constraints <span style="font-weight: 400; color: #5B6472">(optional)</span></h2>
<label style="display: flex; align-items: center; gap: 10px; min-height: 28px"><input type="checkbox" {{?c.along}} data-ev-change="toggleAlong"><span>Along existing lines only</span></label>
<div style="display: flex; align-items: center; gap: 10px; min-height: 28px">
<input id="c-spacing" type="checkbox" {{?c.spacing}} data-ev-change="toggleSpacing">
<label for="c-spacing" style="flex: 1">Minimum station spacing (km)</label>
<input type="number" aria-label="Minimum spacing in kilometers" value="{{spacingKm}}" data-ev-change="setSpacing" step="0.1" min="0.2" style="width: 64px; height: 34px; border: 1px solid #D5DBE3; border-radius: 8px; padding: 0 8px; font: inherit">
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 28px">
<input id="c-budget" type="checkbox" {{?c.budget}} data-ev-change="toggleBudget">
<label for="c-budget" style="flex: 1">Maximum budget (relative)</label>
<select aria-label="Budget level" data-ev-change="setBudget" style="height: 34px; border: 1px solid #D5DBE3; border-radius: 8px; padding: 0 8px; font: inherit; background: #FFFFFF"><option {{!budgetIs.Low}}>Low</option><option {{!budgetIs.Medium}}>Medium</option><option {{!budgetIs.High}}>High</option></select>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #EDF0F4; padding-top: 18px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Map layers</h2>
<label style="display: flex; align-items: center; gap: 10px; min-height: 26px"><input type="checkbox" {{?l.density}} data-ev-change="tDensity"><span>Population density</span></label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 26px"><input type="checkbox" {{?l.lines}} data-ev-change="tLines"><span>Existing subway lines</span></label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 26px"><input type="checkbox" {{?l.stations}} data-ev-change="tStations"><span>Recommended stations</span></label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 26px"><input type="checkbox" {{?l.walk}} data-ev-change="tWalk"><span>10-minute walk area</span></label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 26px"><input type="checkbox" {{?l.deserts}} data-ev-change="tDeserts"><span>Transit deserts</span></label>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
<button type="button" data-ev-click="run" style="height: 46px; border: 0; border-radius: 10px; background: #2457D6; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="#FFFFFF"><path d="M6 4 L20 12 L6 20 Z"></path></svg>Run optimization</button>
<button type="button" data-ev-click="reset" style="height: 46px; border: 1px solid #D5DBE3; border-radius: 10px; background: #FFFFFF; color: #12161C; font: inherit; font-weight: 600; cursor: pointer">Reset</button>
<p role="status" style="margin: 0; min-height: 18px; font-size: 13px; color: {{statusColor}}">{{status}}</p>
</div>
</section>

<section aria-label="Map" style="flex: 999 1 520px; min-width: 0; background: #D6E4EE; border: 1px solid #E3E7ED; border-radius: 14px; position: relative; overflow: hidden; min-height: 560px">
<div id="map-slot" style="position: absolute; inset: 0; z-index: 0"></div>
<div style="position: absolute; z-index: 1000; top: 14px; left: 14px; background: #FFFFFF; border-radius: 12px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(18,22,28,0.10); display: flex; flex-direction: column; gap: 10px; width: 220px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">Population density</span>
<span style="font-size: 12px; color: #5B6472">Residents per km² by census tract (ACS)</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 10px; border-radius: 3px; overflow: hidden">
<span style="background: #E4E0F7"></span><span style="background: #C4BEEC"></span><span style="background: #9B91DD"></span><span style="background: #6E62C8"></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B6472"><span>{{densityLow}}</span><span>{{densityHigh}}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #EDF0F4; padding-top: 10px; font-size: 13px">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 3px; border-radius: 2px; background: #0039A6"></span>Existing line (simplified)</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; border: 2px solid #3A414B; margin: 0 6px"></span>Existing station</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #E5484D; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #E5484D; margin: 0 4px"></span>Recommended station</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 18px; height: 18px; border-radius: 50%; background: rgba(229,72,77,0.22); border: 1px solid rgba(229,72,77,0.5); margin: 0 2px"></span>10-min walk area (≈800 m)</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 14px; border-radius: 50%; border: 1.5px dashed #C4363B"></span>Transit desert</span>
</div>
</div>
<div style="position: absolute; z-index: 1000; right: 14px; bottom: 30px; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 10px; box-shadow: 0 2px 10px rgba(18,22,28,0.10); overflow: hidden">
<button type="button" aria-label="Zoom in" data-ev-click="zoomIn" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#12161C" stroke-width="2" stroke-linecap="round"><path d="M12 5 V19 M5 12 H19"></path></svg></button>
<button type="button" aria-label="Zoom out" data-ev-click="zoomOut" style="width: 44px; height: 44px; border: 0; border-top: 1px solid #EDF0F4; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#12161C" stroke-width="2" stroke-linecap="round"><path d="M5 12 H19"></path></svg></button>
</div>
</section>

<section id="recommendations" aria-label="Recommended stations" style="flex: 1 1 400px; max-width: 480px; min-width: 300px; background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid #EDF0F4">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Recommended stations</h2>
<span style="color: #5B6472">{{countLabel}}</span>
</div>
<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{list}}" as="s" hint-placeholder-count="5">
<article style="display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid #EDF0F4; align-items: center">
<div style="width: 104px; height: 92px; border-radius: 10px; overflow: hidden; position: relative; flex-shrink: 0; background: #D6E4EE">
<div role="img" aria-label="Map of {{s.name}}" style="{{s.thumbStyle}}"></div>
<span style="position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: #E5484D; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.rank}}</span>
<span style="position: absolute; left: 48px; top: 42px; width: 8px; height: 8px; border-radius: 50%; background: #E5484D; box-shadow: 0 0 0 3px rgba(229,72,77,0.3)"></span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h3 style="margin: 0; font-size: 16px; font-weight: 700">{{s.name}}</h3>
<span style="color: #5B6472; font-size: 13px">{{s.near}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 17px">{{s.residents}}</strong><span style="font-size: 12px; color: #5B6472">Residents served</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 17px">{{s.mins}}</strong><span style="font-size: 12px; color: #5B6472">Avg. travel time</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 17px">{{s.score}}</strong><span style="font-size: 12px; color: #5B6472">Access score</span></div>
</div>
</div>
</article>
</sc-for>
</sc-if>
<sc-if value="{{hideList}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 24px 0; color: #5B6472">Recommended locations are hidden. Turn on “Show recommended locations” to see them.</p>
</sc-if>
</section>
</div>

<div id="impact" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<section aria-label="Population coverage" style="background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Population coverage</h2>
<div style="display: flex; align-items: center; gap: 20px">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="92 percent of residents within a 10-minute walk"><circle cx="60" cy="60" r="50" fill="none" stroke="#E8EFFD" stroke-width="16"></circle><circle cx="60" cy="60" r="50" fill="none" stroke="#2457D6" stroke-width="16" stroke-dasharray="289 314" transform="rotate(-90 60 60)"></circle><text x="60" y="67" text-anchor="middle" font-size="22" font-weight="700" fill="#12161C">92%</text></svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<strong style="font-size: 24px">7.4M</strong>
<span style="color: #5B6472">residents within a 10-min walk</span>
<strong style="font-size: 20px; color: #127A3E; margin-top: 6px">+{{added}}</strong>
<span style="color: #5B6472">additional residents vs. today</span>
</div>
</div>
</section>
<section aria-label="Average travel time" style="background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Average travel time</h2>
<div style="display: flex; align-items: flex-end; gap: 24px; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<strong style="font-size: 30px">28 min</strong>
<strong style="font-size: 18px; color: #127A3E">↓ 15%</strong>
<span style="color: #5B6472">vs. current network</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 16px; height: 130px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-weight: 600">33 min</span><span style="width: 56px; height: 90px; background: #C5CBD3; border-radius: 4px 4px 0 0"></span><span style="font-size: 12px; color: #5B6472">Current</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-weight: 600">28 min</span><span style="width: 56px; height: 76px; background: #2457D6; border-radius: 4px 4px 0 0"></span><span style="font-size: 12px; color: #12161C; font-weight: 600">Optimized</span></div>
</div>
</div>
</section>
<section aria-label="New stations" style="background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">New stations</h2>
<div style="display: flex; align-items: center; gap: 20px">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #EEF1F5; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#12161C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 10 H19"></path><path d="M8 17 L6 21 M16 17 L18 21"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<strong style="font-size: 34px">{{count}}</strong>
<a href="#recommendations" style="text-decoration: none">recommended locations →</a>
</div>
</div>
</section>
<section aria-label="Key improvements" style="background: #FFFFFF; border: 1px solid #E3E7ED; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Key improvements</h2>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #E8EFFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20 C3 15.5 15 15.5 15 20"></path><path d="M16 4.5 A3.5 3.5 0 0 1 16 11.5 M18 15 C20 16 21 17.5 21 20"></path></svg></span><div style="display: flex; flex-direction: column"><strong>+{{added}}</strong><span style="color: #5B6472; font-size: 13px">additional residents served</span></div></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #E8EFFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7 V12 L15.5 14"></path></svg></span><div style="display: flex; flex-direction: column"><strong>−5 min</strong><span style="color: #5B6472; font-size: 13px">average travel time</span></div></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #E8EFFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round"><path d="M5 20 V13 M10 20 V9 M15 20 V12 M20 20 V5"></path></svg></span><div style="display: flex; flex-direction: column"><strong>Better connectivity</strong><span style="color: #5B6472; font-size: 13px">across Queens and Brooklyn</span></div></div>
</section>
</div>

<p id="data" style="margin: 0; font-size: 12px; color: #5B6472; line-height: 1.5">{{dataSummary}} Recommendations and impact figures are sample values for design purposes only; they are not modeled results. Basemap © OpenStreetMap contributors. Tract boundaries and population: NYC Open Data and the U.S. Census Bureau ACS. Subway lines are simplified straight segments between stations; walk areas are 800 m circles.</p>
</main>
</div></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
